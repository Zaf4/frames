[package]
name = "framex-cli"
version = "1.0.3"
edition = "2024"
description = "Rust rewrite of the FrameX CLI — a light-weight dataset fetching tool."
license = "Apache-2.0"

[[bin]]
name = "fx"
path = "src/main.rs"

[profile.release]
strip = true
lto = "thin"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
polars = { version = "0.54.4", features = ["ipc", "parquet", "csv", "json", "describe", "fmt"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
ureq = "3.3.0"
