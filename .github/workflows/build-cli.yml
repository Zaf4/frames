name: Build CLI binaries

# Builds the Rust `fx` CLI (cli-rs/) for macOS, Linux (glibc and musl),
# and Windows. Uploads each as a workflow artifact, and on a `v*` tag also
# attaches them to a GitHub Release.
# ..

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create/update the Release on tag builds

defaults:
  run:
    working-directory: cli-rs

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring (via rustls) needs nasm to assemble on Windows MSVC.
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install ARM64 Linux cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure ARM64 Windows toolchain
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli-rs

      - name: Build (release)
        if: matrix.cross != true
        env:
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (release, cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          archive="fx-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" fx
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "fx-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/fx.exe" -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + "  $archive" | Out-File "$archive.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-${{ matrix.target }}
          path: |
            cli-rs/fx-${{ matrix.target }}.tar.gz
            cli-rs/fx-${{ matrix.target }}.zip
            cli-rs/fx-${{ matrix.target }}.*.sha256
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cli-rs/fx-${{ matrix.target }}.tar.gz
            cli-rs/fx-${{ matrix.target }}.zip
            cli-rs/fx-${{ matrix.target }}.*.sha256
